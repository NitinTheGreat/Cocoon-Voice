[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cocoon-agent"
version = "0.1.0"
description = "Cocoon LangGraph/FastAPI backend (Developer B)"
requires-python = ">=3.11,<3.12"
# Runtime dependencies are pinned in requirements.txt; install with `pip install -r requirements.txt -e . --no-deps`.
dependencies = []

[project.scripts]
cocoon-agent = "cocoon_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["cocoon_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
