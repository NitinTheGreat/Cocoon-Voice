    WorkingConditionsCheck:
      properties:
        check_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Check Id
          description: Set when the check was saved (task start, in-task).
        task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Id
        level:
          type: string
          enum:
          - clear
          - advisory
          - acknowledge
          - block
          - unknown
          - not_applicable
          title: Level
        coverage:
          type: string
          enum:
          - fresh
          - stale
          - unavailable
          - misaligned
          - not_applicable
          title: Coverage
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        findings:
          items:
            $ref: '#/components/schemas/ConditionFinding'
          type: array
          title: Findings
        weather:
          anyOf:
          - $ref: '#/components/schemas/WeatherSnapshot'
          - type: 'null'
        policy_version:
          type: string
          title: Policy Version
        data_time:
          type: string
          format: date-time
          title: Data Time
          description: The session's data clock the conditions were matched to.
        checked_at:
          type: string
          format: date-time
          title: Checked At
        acknowledged:
          type: boolean
          title: Acknowledged
          description: The operator confirmed starting despite the findings.
          default: false
      additionalProperties: false
      type: object
      required:
      - level
      - coverage
      - policy_version
      - data_time
      - checked_at
      title: WorkingConditionsCheck
      description: 'A deterministic working-conditions check for an outdoor task under a versioned policy.


        level: clear (proceed), advisory (proceed, told), acknowledge (the operator must confirm before starting),
        block

        (start refused), unknown (no usable weather: shown, never read as fine), not_applicable (indoor zone).

        coverage: fresh / stale (cached value older than the freshness limit, labelled) / unavailable / misaligned
        (live

        weather cannot describe a replay''s data time) / not_applicable.'
  securitySchemes:
    HTTPBearer:
      type: http
      description: 'Exactly ONE of: the trusted service credential (COCOON_SERVICE_TOKEN; server-side callers only,
        never embedded in Android or React), or an actor token (`cct_...`) issued locally by scripts/actor_tokens.py
        for an operator or supervisor principal. Access per route is listed in API_CONTRACT.md.'
      scheme: bearer
