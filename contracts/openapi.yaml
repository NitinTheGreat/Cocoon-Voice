          description: Idempotency key per operator.
          examples:
          - lk-item_4f2c9a
        purpose:
          type: string
          enum:
          - vitals_processing
          - risk_sharing_supervisor
          title: Purpose
        action:
          type: string
          enum:
          - grant
          - revoke
          title: Action
        notice_version:
          type: string
          maxLength: 64
          minLength: 1
          title: Notice Version
          description: Must equal the current notice version.
        expected_version:
          type: integer
          minimum: 0.0
          title: Expected Version
          description: OperatorConsentState.version the operator saw.
        is_synthetic_demo_record:
          type: boolean
          title: Is Synthetic Demo Record
          description: True for rehearsal grants by synthetic actors.
          default: false
        captured_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Captured At
          description: Device time of the decision (informational; ordering uses expected_version).
