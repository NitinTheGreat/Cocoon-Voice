          description: 'auth_unavailable: the token store could not be read (retryable; never treated as success)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: 'replay_expired: reload the overview'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'rate_limited: too many open streams'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
