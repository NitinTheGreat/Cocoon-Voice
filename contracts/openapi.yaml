    SessionAssociation:
      properties:
        operator_id:
          type: string
          title: Operator Id
        machine_id:
          type: string
          title: Machine Id
        site_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Site Id
        shift_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Shift Id
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
          description: The owned session this association comes from.
      additionalProperties: false
      type: object
      required:
      - operator_id
      - machine_id
      title: SessionAssociation
      description: 'An association the caller actually holds. For an operator: one of their own catalog_verified
        sessions,

        created by the trusted service. Catalog membership alone is never listed as an association.'
    SessionCommand:
      properties:
        schema_version:
          type: string
          const: cocoon.command.v1
          title: Schema Version
          default: cocoon.command.v1
        command_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,127}$
          title: Command Id
          description: Unique per caller; an identical retry returns the saved result.
          examples:
          - lk-item_4f2c9a
        kind:
          type: string
          enum:
          - task.start
          - task.complete
          - incident.edit
          - incident.confirm
          - incident.dismiss
          title: Kind
        captured_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Captured At
          description: Device time of the tap (informational).
        expected_version:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expected Version
        payload:
          $ref: '#/components/schemas/CommandPayload'
      additionalProperties: false
      type: object
      required:
      - command_id
      - kind
      - payload
      title: SessionCommand
      description: 'POST /v1/sessions/{session_id}/commands. A subset of the proposed cocoon.command.v1 envelope:
        the binding is

        taken from the authenticated session (never from the body); `expected_version` guards against stale taps.'
