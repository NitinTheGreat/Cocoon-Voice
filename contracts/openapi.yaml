                pending_cancelled: '#/components/schemas/PendingCancelledAction'
                task_completed: '#/components/schemas/TaskTransitionAction'
                task_rejected: '#/components/schemas/TaskRejectedAction'
                task_started: '#/components/schemas/TaskTransitionAction'
                training_assigned: '#/components/schemas/TrainingAssignedAction'
                training_status: '#/components/schemas/TrainingStatusAction'
          type: array
          title: Actions
        state_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: State Version
        llm_mode:
          anyOf:
          - type: string
            enum:
            - live
            - mock
          - type: 'null'
          title: Llm Mode
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorBody'
          - type: 'null'
        retry_after_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry After Ms
          description: 'Present when status is processing: wait this long, then GET poll_url.'
        poll_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Poll Url
        created_at:
          type: string
          format: date-time
          title: Created At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        branch:
          anyOf:
          - type: string
            enum:
            - tasks
            - safety_incidents
            - training
            - general_assistance
          - type: 'null'
          title: Branch
          description: Workflow branch the turn was classified into.
        action_records:
          items:
            $ref: '#/components/schemas/ActionRecord'
          type: array
          title: Action Records
          description: 'Writes committed by this turn, also on a failed turn: a failure after a committed write
            never means nothing was saved.'
      additionalProperties: false
      type: object
      required:
      - session_id
      - turn_id
      - status
      - created_at
      title: TurnResult
  securitySchemes:
    HTTPBearer:
      type: http
      description: 'Exactly ONE of: the trusted service credential (COCOON_SERVICE_TOKEN; server-side callers only,
        never embedded in Android or React), or an actor token (`cct_...`) issued locally by scripts/actor_tokens.py
        for an operator or supervisor principal. Access per route is listed in API_CONTRACT.md.'
      scheme: bearer
