components:
  schemas:
    ActionRecord:
      properties:
        action_id:
          type: string
          title: Action Id
        kind:
          type: string
          title: Kind
        outcome:
          type: string
          enum:
          - completed
          - failed
          - unknown
          title: Outcome
        record_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Record Type
        record_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Record Id
        summary:
          type: string
          title: Summary
        state_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: State Version
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - action_id
      - kind
      - outcome
      - summary
      - created_at
      title: ActionRecord
      description: Durable outcome of one write in this turn (committed together with the write).
    Alert:
      properties:
        alert_id:
          type: string
          title: Alert Id
        rule_id:
          type: string
          title: Rule Id
        alert_type:
          type: string
          enum:
          - seatbelt_unfastened
          - prolonged_idle
          - idle_unbelted
          - working_conditions
          - proximity
          - sudden_start
          - sudden_stop
          - steep_slope
          - abnormal_fuel_per_cycle
          - repeated_violations
          title: Alert Type
        severity:
          type: string
          enum:
          - warning
          - critical
          title: Severity
        status:
          type: string
          enum:
          - active
          - cleared
          title: Status
        message:
          type: string
          title: Message
        explanation:
          type: string
          title: Explanation
        simulated:
          type: boolean
          title: Simulated
        trigger_readings:
          $ref: '#/components/schemas/TelemetryReadings'
        started_at:
          type: string
          format: date-time
          title: Started At
        cleared_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Cleared At
        policy_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy Version
          description: Safety policy that produced this episode.
        source_status:
          anyOf:
          - type: string
            enum:
            - demo_assumption
            - published_limit
          - type: 'null'
          title: Source Status
          description: 'demo_assumption: thresholds are demo values, not published CAT limits.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        recommended_action:
          anyOf:
          - type: string
          - type: 'null'
          title: Recommended Action
        evidence:
          anyOf:
          - $ref: '#/components/schemas/AlertEvidence'
          - type: 'null'
        correlated_alert_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlated Alert Id
          description: 'Parent episode this one overlaps (same physical situation). A linked combined episode keeps
            its own rule identity and evidence but is deliberately not announced or drafted again; `announced: false`
            is expected, not a defect.'
        draft_incident_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Draft Incident Id
          description: Automatic incident draft linked to this episode.
        training_assignment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Training Assignment Id
          description: Lesson assignment linked to this episode.
        announced:
          type: boolean
          title: Announced
          description: 'An alert_started announcement was created (not: heard).'
          default: true
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
          description: Family-specific evidence saved when the episode opened (e.g. the condition check of a working_conditions
            episode). Null for belt/idle episodes.
        subject_key:
          type: string
          title: Subject Key
          description: What the episode is about within its rule (e.g. the detected entity); empty for one-per-rule
            episodes.
          default: ''
        level:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
          description: Current level of a graded episode (e.g. warning, danger).
        cleared_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Cleared Reason
          description: observed_clear, expired_without_detection (not proof the hazard left), instant_event (a one-off
            event such as a sudden stop), ...
        updates:
          items:
            $ref: '#/components/schemas/AlertUpdate'
          type: array
          title: Updates
      additionalProperties: false
      type: object
      required:
      - alert_id
      - rule_id
      - alert_type
      - severity
      - status
      - message
      - explanation
      - simulated
      - trigger_readings
      - started_at
      title: Alert
    AlertEvidence:
      properties:
        event_id:
          type: string
          title: Event Id
        observed_at:
          type: string
          format: date-time
          title: Observed At
          description: Observation (data) time of the triggering sample.
        readings:
          $ref: '#/components/schemas/TelemetryReadings'
        idle_since:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Idle Since
          description: Start of the observed idle streak, if any.
        idle_seconds_observed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Idle Seconds Observed
          description: observed_at - idle_since (data clock).
        machine_category:
          anyOf:
          - type: string
          - type: 'null'
          title: Machine Category
        applicability:
          type: string
          enum:
          - all_categories
          - category_listed
          title: Applicability
          default: all_categories
      additionalProperties: false
      type: object
      required:
      - event_id
      - observed_at
      - readings
      title: AlertEvidence
      description: What the rule saw when the episode opened. Saved once; later readings never change it.
    AlertExplainedAction:
      properties:
        type:
          type: string
          const: alert_explained
          title: Type
        alert:
          anyOf:
          - $ref: '#/components/schemas/Alert'
          - type: 'null'
        announcement_event_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Announcement Event Id
          description: The announcement that raised this alert.
        deliveries:
          items:
            $ref: '#/components/schemas/DeliveryRecord'
          type: array
          title: Deliveries
          description: Playback reports for that announcement. Played is not acknowledgement.
        related_alerts:
          items:
            $ref: '#/components/schemas/Alert'
          type: array
          title: Related Alerts
          description: Linked episodes of the same situation (e.g. the combined idle + unbelted episode under a
            seatbelt warning), each with its own saved evidence.
      additionalProperties: false
      type: object
      required:
      - type
      - alert
      title: AlertExplainedAction
      description: The explanation comes from the episode's saved evidence, never from the latest readings.
    AlertUpdate:
      properties:
        update_id:
          type: string
          title: Update Id
        level:
          type: string
          title: Level
        previous_level:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous Level
        observed_at:
          type: string
          format: date-time
          title: Observed At
        event_id:
          type: string
          title: Event Id
          description: Telemetry sample that caused the change.
        details:
          additionalProperties: true
          type: object
          title: Details
        announcement_event_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Announcement Event Id
          description: Set when the change was announced.
      additionalProperties: false
      type: object
      required:
      - update_id
      - level
      - observed_at
      - event_id
      - details
      title: AlertUpdate
      description: A later change of a published episode (e.g. warning -> danger), with its own evidence and identity.
    Announcement:
      properties:
        event_id:
          type: string
          title: Event Id
        sequence:
          type: integer
          title: Sequence
        type:
          type: string
          enum:
          - alert_started
          - alert_cleared
          - shift_briefing
          - alert_escalated
          - coaching_prompt
          - wellbeing_advice
          - schedule_changed
          - sos_checkin
          title: Type
        priority:
          type: string
          enum:
          - low
          - normal
          - high
          - critical
          title: Priority
        speech:
          type: string
          title: Speech
        alert_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Alert Id
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        deliveries:
          items:
            $ref: '#/components/schemas/DeliveryRecord'
          type: array
          title: Deliveries
          description: Latest playback report per consumer. Played is not acknowledgement.
        expired:
          type: boolean
          title: Expired
          description: 'expires_at has passed (server clock): do not speak it as new.'
          default: false
        presentations:
          items:
            $ref: '#/components/schemas/PresentationView'
          type: array
          title: Presentations
          description: Screen/vibration reports (separate from audio playback; never an acknowledgement).
      additionalProperties: false
      type: object
      required:
      - event_id
      - sequence
      - type
      - priority
      - speech
      - created_at
      title: Announcement
    AnswerFeedback:
      properties:
        question_id:
          type: string
          title: Question Id
        choice_id:
          type: string
          title: Choice Id
        correct:
          type: boolean
          title: Correct
        correct_choice_id:
          type: string
          title: Correct Choice Id
          description: Shown only after the answer was saved.
        remediation:
          anyOf:
          - type: string
          - type: 'null'
          title: Remediation
        feedback:
          anyOf:
          - type: string
          - type: 'null'
          title: Feedback
      additionalProperties: false
      type: object
      required:
      - question_id
      - choice_id
      - correct
      - correct_choice_id
      title: AnswerFeedback
    ApprovalApplicationView:
      properties:
        status:
          type: string
          enum:
          - not_started
          - pending
          - applied
          - failed_stale_inputs
          - failed
          - not_applicable
          title: Status
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        applied_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Applied At
      additionalProperties: false
      type: object
      required:
      - status
      title: ApprovalApplicationView
      description: 'Separate from the decision: an approved request may still fail to apply (never reported as applied).'
    ApprovalDecisionRequest:
      properties:
        decision_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,127}$
          title: Decision Id
          examples:
          - lk-item_4f2c9a
        decision:
          type: string
          enum:
          - approve
          - reject
          title: Decision
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
        payload_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Payload Sha256
        reason:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Reason
      additionalProperties: false
      type: object
      required:
      - decision_id
      - decision
      - expected_version
      - payload_sha256
      title: ApprovalDecisionRequest
      description: POST /v1/approvals/{approval_id}/decision (scoped supervisor).
    ApprovalDecisionResult:
      properties:
        approval:
          $ref: '#/components/schemas/ApprovalView'
        decision_recorded:
          type: boolean
          title: Decision Recorded
          description: False for an identical retry (the saved decision is returned).
      additionalProperties: false
      type: object
      required:
      - approval
      - decision_recorded
      title: ApprovalDecisionResult
    ApprovalDecisionView:
      properties:
        decision_id:
          type: string
          title: Decision Id
        decision:
          type: string
          enum:
          - approve
          - reject
          title: Decision
        decided_by:
          type: string
          title: Decided By
        decided_at:
          type: string
          format: date-time
          title: Decided At
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      additionalProperties: false
      type: object
      required:
      - decision_id
      - decision
      - decided_by
      - decided_at
      title: ApprovalDecisionView
    ApprovalPageView:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ApprovalView'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      additionalProperties: false
      type: object
      required:
      - items
      title: ApprovalPageView
    ApprovalRequest:
      properties:
        approval_id:
          type: string
          title: Approval Id
        kind:
          type: string
          enum:
          - incident_escalation
          - repeated_violations
          - schedule_change
          title: Kind
        incident_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Incident Id
        alert_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Alert Id
          description: 'repeated_violations: the repeat episode behind it.'
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - expired
          - cancelled
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - approval_id
      - kind
      - status
      - created_at
      title: ApprovalRequest
      description: 'A request for supervisor review. `pending` until a supervisor decision route exists (Batch D);
        creating it

        is not a notification and not an approval.'
    ApprovalView:
      properties:
        approval_id:
          type: string
          title: Approval Id
        kind:
          type: string
          enum:
          - incident_escalation
          - repeated_violations
          - schedule_change
          title: Kind
        action_type:
          type: string
          enum:
          - notify_supervisor
          - escalate_repeat_violation
          - apply_schedule_change
          title: Action Type
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - expired
          - cancelled
          title: Status
        eligibility:
          type: string
          enum:
          - eligible
          - ineligible_no_site
          title: Eligibility
        site_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Site Id
        operator_id:
          type: string
          title: Operator Id
        machine_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Machine Id
        proposer:
          type: string
          title: Proposer
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        version:
          type: integer
          title: Version
        payload_sha256:
          type: string
          title: Payload Sha256
        escalation:
          anyOf:
          - $ref: '#/components/schemas/EscalationView'
          - type: 'null'
        schedule:
          anyOf:
          - $ref: '#/components/schemas/ScheduleProposalView'
          - type: 'null'
        decision:
          anyOf:
          - $ref: '#/components/schemas/ApprovalDecisionView'
          - type: 'null'
        application:
