components:
  schemas:
    ActionRecord:
      properties:
        action_id:
          type: string
          title: Action Id
        kind:
          type: string
          title: Kind
        outcome:
          type: string
          enum:
          - completed
          - failed
          - unknown
          title: Outcome
        record_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Record Type
        record_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Record Id
        summary:
          type: string
          title: Summary
        state_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: State Version
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - action_id
      - kind
      - outcome
      - summary
      - created_at
      title: ActionRecord
      description: Durable outcome of one write in this turn (committed together with the write).
    Alert:
      properties:
        alert_id:
          type: string
          title: Alert Id
        rule_id:
          type: string
          title: Rule Id
        alert_type:
          type: string
          enum:
          - seatbelt_unfastened
          - prolonged_idle
          - idle_unbelted
          title: Alert Type
        severity:
          type: string
          enum:
          - warning
          - critical
          title: Severity
        status:
          type: string
          enum:
          - active
          - cleared
          title: Status
        message:
          type: string
          title: Message
        explanation:
          type: string
          title: Explanation
        simulated:
          type: boolean
          title: Simulated
        trigger_readings:
          $ref: '#/components/schemas/TelemetryReadings'
        started_at:
          type: string
          format: date-time
          title: Started At
        cleared_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Cleared At
        policy_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy Version
          description: Safety policy that produced this episode.
        source_status:
          anyOf:
          - type: string
            enum:
            - demo_assumption
            - published_limit
          - type: 'null'
          title: Source Status
          description: 'demo_assumption: thresholds are demo values, not published CAT limits.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        recommended_action:
          anyOf:
          - type: string
          - type: 'null'
          title: Recommended Action
        evidence:
          anyOf:
          - $ref: '#/components/schemas/AlertEvidence'
          - type: 'null'
        correlated_alert_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlated Alert Id
          description: Episode this one overlaps (same physical situation); it is not announced again.
        draft_incident_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Draft Incident Id
          description: Automatic incident draft linked to this episode.
        training_assignment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Training Assignment Id
          description: Lesson assignment linked to this episode.
        announced:
          type: boolean
          title: Announced
          description: 'An alert_started announcement was created (not: heard).'
          default: true
      additionalProperties: false
      type: object
      required:
      - alert_id
      - rule_id
      - alert_type
      - severity
      - status
      - message
      - explanation
      - simulated
      - trigger_readings
      - started_at
      title: Alert
    AlertEvidence:
      properties:
        event_id:
          type: string
          title: Event Id
        observed_at:
          type: string
          format: date-time
          title: Observed At
          description: Observation (data) time of the triggering sample.
        readings:
          $ref: '#/components/schemas/TelemetryReadings'
        idle_since:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Idle Since
          description: Start of the observed idle streak, if any.
        idle_seconds_observed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Idle Seconds Observed
          description: observed_at - idle_since (data clock).
        machine_category:
          anyOf:
          - type: string
          - type: 'null'
          title: Machine Category
        applicability:
          type: string
          enum:
          - all_categories
          - category_listed
          title: Applicability
          default: all_categories
      additionalProperties: false
      type: object
      required:
      - event_id
      - observed_at
      - readings
      title: AlertEvidence
      description: What the rule saw when the episode opened. Saved once; later readings never change it.
    AlertExplainedAction:
      properties:
        type:
          type: string
          const: alert_explained
          title: Type
        alert:
          anyOf:
