          title: After
        description: Exclusive feed cursor
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 160
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: 'text/event-stream of cocoon.supervisor-feed.v1 events (`id` = feed sequence); `: heartbeat`
            comments; `stream_closed` on revocation, expiry or max duration'
          content:
            text/event-stream:
              schema:
                type: string
              x-sse-framing: UTF-8 SSE. One event = `id:` (feed sequence), `event:` (type), one `data:` line with
                one JSON envelope (schema_version, site_id, event_id, sequence, type, created_at, data), then a
                blank line. Comment lines are heartbeats. The data is projected when sent, under the reader's current
                scope and the operator's current consent.
        '401':
          description: 'unauthorized: missing, malformed, unknown, expired or revoked bearer token, or more than
            one Authorization header (the cause is deliberately not distinguished)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
