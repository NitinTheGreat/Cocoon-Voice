      - kind
      - action_type
      - status
      - eligibility
      - operator_id
      - proposer
      - created_at
      - version
      - payload_sha256
      - application
      title: ApprovalView
      description: Runtime shape of the proposed ApprovalRecord. Built from explicit fields only.
    AssessmentSummary:
      properties:
        kind:
          type: string
          enum:
          - quiz
          - scenario
          title: Kind
        quiz_id:
          type: string
          title: Quiz Id
        version:
          type: integer
          title: Version
        question_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Question Count
          description: Null for a branching scenario.
        pass_mark:
