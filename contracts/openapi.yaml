        context_status:
          type: string
          enum:
          - unavailable
          - trusted_binding
          - legacy_unverified
          title: Context Status
          description: 'unavailable: no trusted site/shift is known (not a default site). trusted_binding: site/shift
            matched a server-configured binding. legacy_unverified: pre-upgrade session.'
