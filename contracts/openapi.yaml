          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,127}$
          - type: 'null'
          title: Shift Id
          description: Optional; see site_id.
      additionalProperties: false
      type: object
      required:
      - client_session_key
      - room_name
      - participant_identity
      - operator_id
      - machine_id
      title: SessionCreateRequest
    SessionState:
      properties:
        session_id:
          type: string
          title: Session Id
        state_version:
          type: integer
          title: State Version
        llm_mode:
          type: string
          enum:
          - live
          - mock
          title: Llm Mode
        tasks:
          items:
            $ref: '#/components/schemas/Task'
          type: array
          title: Tasks
        incidents:
          items:
            $ref: '#/components/schemas/Incident'
          type: array
          title: Incidents
        training_assignments:
          items:
            $ref: '#/components/schemas/TrainingAssignment'
          type: array
          title: Training Assignments
        available_lessons:
          items:
            $ref: '#/components/schemas/Lesson'
          type: array
          title: Available Lessons
        active_alerts:
          items:
            $ref: '#/components/schemas/Alert'
          type: array
          title: Active Alerts
        latest_alert:
          anyOf:
          - $ref: '#/components/schemas/Alert'
          - type: 'null'
        pending_question:
          anyOf:
          - $ref: '#/components/schemas/PendingQuestion'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - session_id
      - state_version
      - llm_mode
      - tasks
      - incidents
      - training_assignments
      - available_lessons
      - active_alerts
      - latest_alert
      - pending_question
      title: SessionState
    Task:
      properties:
        task_id:
          type: string
          title: Task Id
        title:
          type: string
          title: Title
        details:
          type: string
          title: Details
        priority:
          type: string
          enum:
          - low
          - normal
          - high
          title: Priority
        status:
          type: string
          enum:
          - pending
          - in_progress
          - done
          title: Status
      additionalProperties: false
      type: object
      required:
      - task_id
      - title
      - details
      - priority
      - status
      title: Task
    TelemetryReadings:
      properties:
        engine_on:
          type: boolean
          title: Engine On
        seatbelt_fastened:
          type: boolean
          title: Seatbelt Fastened
        idle_seconds:
          type: integer
          maximum: 86400.0
          minimum: 0.0
          title: Idle Seconds
      additionalProperties: false
      type: object
      required:
      - engine_on
      - seatbelt_fastened
      - idle_seconds
      title: TelemetryReadings
    TelemetryRequest:
      properties:
        event_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,127}$
          title: Event Id
          examples:
          - lk-item_4f2c9a
        observed_at:
          type: string
          format: date-time
          title: Observed At
          description: Timezone-aware timestamp; normalised to UTC.
        simulated:
          type: boolean
          const: true
          title: Simulated
          description: 'Must be true: v1 accepts prototype simulator data only.'
        readings:
          $ref: '#/components/schemas/TelemetryReadings'
      additionalProperties: false
      type: object
      required:
      - event_id
      - observed_at
      - simulated
      - readings
      title: TelemetryRequest
    TelemetryResult:
      properties:
        session_id:
          type: string
          title: Session Id
        event_id:
          type: string
          title: Event Id
        duplicate:
          type: boolean
          title: Duplicate
        stale:
          type: boolean
          title: Stale
          description: True when observed_at is older than the newest processed sample.
        alerts_opened:
          items:
            type: string
          type: array
          title: Alerts Opened
        alerts_cleared:
          items:
            type: string
          type: array
          title: Alerts Cleared
        announcements_created:
          items:
            type: string
          type: array
          title: Announcements Created
        active_alerts:
          items:
            $ref: '#/components/schemas/Alert'
          type: array
          title: Active Alerts
        state_version:
          type: integer
          title: State Version
      additionalProperties: false
      type: object
      required:
      - session_id
      - event_id
      - duplicate
      - stale
      - alerts_opened
      - alerts_cleared
      - announcements_created
      - active_alerts
      - state_version
      title: TelemetryResult
    TrainingAssignedAction:
      properties:
        type:
          type: string
          const: training_assigned
          title: Type
        assignment:
          $ref: '#/components/schemas/TrainingAssignment'
        created:
          type: boolean
          title: Created
          description: False when this lesson was already assigned to the operator.
      additionalProperties: false
      type: object
      required:
      - type
      - assignment
      - created
      title: TrainingAssignedAction
    TrainingAssignment:
      properties:
        assignment_id:
          type: string
          title: Assignment Id
        lesson_id:
          type: string
          title: Lesson Id
        lesson_title:
          type: string
          title: Lesson Title
        operator_id:
          type: string
          title: Operator Id
        status:
          type: string
          enum:
          - assigned
          - completed
          title: Status
        assigned_at:
          type: string
          format: date-time
          title: Assigned At
      additionalProperties: false
      type: object
      required:
      - assignment_id
      - lesson_id
      - lesson_title
      - operator_id
      - status
      - assigned_at
      title: TrainingAssignment
    TrainingStatusAction:
      properties:
        type:
          type: string
          const: training_status
          title: Type
        assignments:
          items:
            $ref: '#/components/schemas/TrainingAssignment'
          type: array
          title: Assignments
        available_lessons:
          items:
            $ref: '#/components/schemas/Lesson'
          type: array
          title: Available Lessons
      additionalProperties: false
      type: object
      required:
      - type
      - assignments
      - available_lessons
      title: TrainingStatusAction
    TurnRequest:
      properties:
        turn_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,127}$
          title: Turn Id
          examples:
          - lk-item_4f2c9a
        text:
          type: string
          maxLength: 2000
          minLength: 1
          title: Text
        source:
          type: string
          enum:
          - voice
          - text
          title: Source
      additionalProperties: false
      type: object
      required:
      - turn_id
      - text
      - source
      title: TurnRequest
    TurnResult:
      properties:
        session_id:
          type: string
          title: Session Id
        turn_id:
          type: string
          title: Turn Id
        status:
          type: string
          enum:
          - processing
          - completed
          - failed
          title: Status
        speech:
          anyOf:
          - type: string
          - type: 'null'
          title: Speech
          description: Operator-facing text for TTS. Present only when status is completed.
        actions:
          items:
            oneOf:
            - $ref: '#/components/schemas/NextTaskAction'
            - $ref: '#/components/schemas/IncidentLoggedAction'
            - $ref: '#/components/schemas/InformationRequestedAction'
            - $ref: '#/components/schemas/TrainingAssignedAction'
            - $ref: '#/components/schemas/TrainingStatusAction'
            - $ref: '#/components/schemas/AlertExplainedAction'
            - $ref: '#/components/schemas/PendingCancelledAction'
            discriminator:
              propertyName: type
              mapping:
                alert_explained: '#/components/schemas/AlertExplainedAction'
                incident_logged: '#/components/schemas/IncidentLoggedAction'
                information_requested: '#/components/schemas/InformationRequestedAction'
                next_task: '#/components/schemas/NextTaskAction'
                pending_cancelled: '#/components/schemas/PendingCancelledAction'
                training_assigned: '#/components/schemas/TrainingAssignedAction'
                training_status: '#/components/schemas/TrainingStatusAction'
          type: array
          title: Actions
        state_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: State Version
        llm_mode:
          anyOf:
          - type: string
            enum:
            - live
            - mock
          - type: 'null'
          title: Llm Mode
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorBody'
          - type: 'null'
        retry_after_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry After Ms
          description: 'Present when status is processing: wait this long, then GET poll_url.'
        poll_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Poll Url
        created_at:
          type: string
          format: date-time
          title: Created At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
      additionalProperties: false
      type: object
      required:
      - session_id
      - turn_id
      - status
      - created_at
      title: TurnResult
  securitySchemes:
    HTTPBearer:
      type: http
      description: Service token from COCOON_SERVICE_TOKEN
      scheme: bearer
