        room_name:
          type: string
          maxLength: 256
          minLength: 1
          title: Room Name
        participant_identity:
          type: string
          maxLength: 256
          minLength: 1
          title: Participant Identity
        operator_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Operator Id
