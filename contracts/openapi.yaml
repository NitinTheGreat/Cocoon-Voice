      required:
      - origin
      - generator
      title: TelemetryProvenance
    TelemetryReadings:
      properties:
        engine_on:
          type: boolean
          title: Engine On
        seatbelt_fastened:
          type: boolean
          title: Seatbelt Fastened
        idle_seconds:
          type: integer
          maximum: 86400.0
          minimum: 0.0
          title: Idle Seconds
          description: Client-reported counter; informational. Idle rules time idling from observation timestamps
            instead.
        operating_state:
          anyOf:
          - type: string
            enum:
            - 'off'
            - idle
            - working
            - travel
          - type: 'null'
          title: Operating State
          description: 'Observed machine state. Omitted = unknown: idle rules neither open nor clear.'
        speed_kph:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Speed Kph
          description: Observed ground speed (motion).
        proximity:
          anyOf:
          - items:
              $ref: '#/components/schemas/ProximityDetection'
            type: array
          - type: 'null'
          title: Proximity
          description: 'A proximity scan: omitted = no detector data (unknown); an empty list = a scan with no detections,
            which is still not proof that nobody is near.'
        motion:
          anyOf:
          - $ref: '#/components/schemas/MotionWindow'
          - type: 'null'
        pitch_deg:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Pitch Deg
          description: Fore-aft tilt in degrees.
        roll_deg:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Roll Deg
          description: Side tilt in degrees.
        grade_pct:
          anyOf:
          - type: number
            maximum: 300.0
            minimum: -300.0
          - type: 'null'
          title: Grade Pct
          description: Ground grade in percent (100 % = 45 degrees), when pitch is not given.
        fuel_meter_l:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Fuel Meter L
          description: Cumulative fuel meter, litres.
        load_cycles_total:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Load Cycles Total
          description: Cumulative work/load cycle counter.
      additionalProperties: false
      type: object
      required:
      - engine_on
      - seatbelt_fastened
      - idle_seconds
      title: TelemetryReadings
    TelemetryRequest:
      properties:
        event_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,127}$
          title: Event Id
          examples:
          - lk-item_4f2c9a
        observed_at:
          type: string
          format: date-time
          title: Observed At
          description: Timezone-aware timestamp; normalised to UTC.
        simulated:
          type: boolean
          const: true
          title: Simulated
          description: 'Must be true: v1 accepts prototype simulator data only.'
        readings:
          $ref: '#/components/schemas/TelemetryReadings'
        provenance:
          anyOf:
          - $ref: '#/components/schemas/TelemetryProvenance'
          - type: 'null'
          description: Where a simulated sample came from. Stored, never used by the rules.
      additionalProperties: false
      type: object
      required:
      - event_id
      - observed_at
      - simulated
      - readings
      title: TelemetryRequest
    TelemetryResult:
