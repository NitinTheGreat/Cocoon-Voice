          enum:
          - modelled_current
          - modelled_forecast
          - synthetic_fixture
          title: Kind
        site_id:
          type: string
          title: Site Id
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
          description: Provider grid-cell latitude (may differ from the site).
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
        valid_from:
          type: string
          format: date-time
          title: Valid From
        valid_to:
          type: string
          format: date-time
          title: Valid To
        precipitation_window_start:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Precipitation Window Start
        precipitation_window_end:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Precipitation Window End
        temperature_c:
          anyOf:
          - type: number
          - type: 'null'
          title: Temperature C
        relative_humidity_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Relative Humidity Pct
        precipitation_mm:
          anyOf:
          - type: number
          - type: 'null'
          title: Precipitation Mm
        precipitation_rate_mm_h:
          anyOf:
          - type: number
          - type: 'null'
          title: Precipitation Rate Mm H
        wind_speed_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Wind Speed Ms
        wind_gust_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Wind Gust Ms
        visibility_m:
          anyOf:
          - type: number
          - type: 'null'
          title: Visibility M
        weather_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Weather Code
          description: WMO weather code as reported by the provider.
        retrieved_at:
          type: string
          format: date-time
          title: Retrieved At
        issued_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Issued At
        units:
          additionalProperties:
            type: string
          type: object
          title: Units
        quality:
          type: string
          enum:
          - complete
          - partial
          title: Quality
        provenance:
          type: string
          title: Provenance
      additionalProperties: false
      type: object
      required:
      - record_id
      - provider
      - kind
      - site_id
      - valid_from
      - valid_to
      - retrieved_at
      - units
      - quality
      - provenance
      title: WeatherSnapshot
      description: 'Numeric site conditions exactly as used by a check. Values are normalised to the units in `units`.


        Open-Meteo values are weather-model output for the site''s grid cell (`kind` modelled_current / modelled_forecast),

        not a machine-mounted sensor. Instant variables apply at `valid_from`; precipitation is the provider''s
        sum over

        [`precipitation_window_start`, `precipitation_window_end`], also given as a rate. `issued_at` is only set
        when the

        provider states a forecast issue time (Open-Meteo does not; retrieval time and generation time are not issue

        times). Fixture values are synthetic and aligned to the site-local clock of the data time.'
