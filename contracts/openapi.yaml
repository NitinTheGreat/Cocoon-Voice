      - machine_id
      - origin
      - status
      - description
      - version
      - created_at
      title: IncidentDraft
      description: 'An unconfirmed report: an automatic draft from a safety episode, or an operator''s report that
        still misses a

        fact (`missing`). Not an incident until confirmed; confirming allocates the real incident ID once

        (`incident_id`). A draft with missing facts cannot be confirmed until each is stated or explicitly unknown.'
    IncidentDraftAction:
      properties:
