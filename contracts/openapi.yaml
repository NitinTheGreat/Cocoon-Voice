          - $ref: '#/components/schemas/IncidentDraft'
          - type: 'null'
        incident:
          anyOf:
          - $ref: '#/components/schemas/Incident'
          - type: 'null'
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - command_id
      - kind
      - status
      - duplicate
      - summary
      - state_version
      - created_at
      title: SessionCommandResult
    SessionCreateRequest:
      properties:
        client_session_key:
          type: string
          maxLength: 256
          minLength: 1
