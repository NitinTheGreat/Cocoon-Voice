      - session_id
      - operator_id
      - machine_id
      - description
      - source_turn_id
      - created_at
      title: Incident
      description: 'A confirmed report. `description` is the "what". Structured fields are additive; each `*_basis`
        says where a

        value came from (stated by the operator, taken from recorded context, or a rule default) so nothing looks

        invented. `severity` is never inferred from wording: null with basis `stated_unknown` means the operator
        said

        they do not know; null with no basis is a report saved before severity was asked for. A `rule_default` severity

        is the warning rule''s configured value, not an operator assessment of the incident.'
