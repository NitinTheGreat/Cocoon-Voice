            - active_task
          - type: 'null'
          title: Zone Basis
        location_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Text
        occurred_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Occurred At
        occurred_basis:
          anyOf:
          - type: string
            enum:
            - time_of_report
            - observation_time
            - operator_relative
            - operator_clock_time
            - operator_entered
            - unresolved
          - type: 'null'
          title: Occurred Basis
        occurred_expression:
          anyOf:
          - type: string
          - type: 'null'
          title: Occurred Expression
        occurred_reference_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Occurred Reference At
        episode_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Episode Id
        version:
          type: integer
          title: Version
        incident_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Incident Id
          description: Set once, when the draft is confirmed.
        created_at:
          type: string
          format: date-time
          title: Created At
        confirmed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Confirmed At
        dismissed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Dismissed At
        notify_supervisor:
          type: boolean
          title: Notify Supervisor
          description: Confirming also requests supervisor review.
          default: false
        missing:
          items:
            type: string
            enum:
            - severity
            - occurred_time
          type: array
          title: Missing
          description: Facts still needed before confirmation.
        client_draft_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Draft Id
          description: Device draft ID of an offline upload.
        captured_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Captured At
          description: Device capture time of an offline upload.
        capture_mode:
          type: string
          enum:
          - online
          - offline_sync
          title: Capture Mode
          default: online
      additionalProperties: false
