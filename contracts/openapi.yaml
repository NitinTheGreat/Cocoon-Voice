      type: object
      required:
      - change_id
      - purpose
      - action
      - notice_version
      - expected_version
      title: OperatorConsentChange
      description: POST /v1/operators/{operator_id}/consents. Only the operator's own actor token may send it.
    OperatorConsentChangeResult:
      properties:
